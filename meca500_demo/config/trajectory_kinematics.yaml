meca500_trajectory_node:
  ros__parameters:
    robot_description_kinematics:
      meca500_arm:
        kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
        kinematics_solver_timeout: 1.0
        solve_type: Speed
        kinematics_solver_search_resolution: 0.005
        # Default is 1e-5 (10um) -- looser than the robot's actual 5um
        # capability, which leaves enough IK/FK round-trip slack to flip
        # Pilz's own arc-flatness check (MAX_COLINEAR_NORM, 2.5e-11) on
        # arcs that pass our identical check using the commanded (not
        # solved) start point.
        epsilon: 0.000005
