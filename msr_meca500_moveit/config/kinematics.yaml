meca500_arm:
  kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
  kinematics_solver_search_resolution: 0.0050000000000000001
  kinematics_solver_timeout: 1.0
  solve_type: Speed
  # Default is 1e-5 (10um) -- looser than the robot's actual 5um
  # capability, which leaves enough IK/FK round-trip slack to flip Pilz's
  # own arc-flatness check (MAX_COLINEAR_NORM, 2.5e-11) on arcs that pass
  # our identical check using the commanded (not solved) start point.
  epsilon: 0.000005